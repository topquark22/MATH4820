<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" role="img" aria-labelledby="title desc">
<title id="title">Graphical confusion matrix</title><desc id="desc">Reference truth as columns and decisions as rows, with definitions of the three performance measures.</desc>
<rect width="760" height="415" fill="white"/><g font-family="Arial, sans-serif">
<text x="380" y="29" font-size="21" text-anchor="middle" fill="#172334">Binary feature decision versus known reference</text><text x="375" y="67" font-size="17" text-anchor="middle" fill="#172334">Reference feature present</text><text x="615" y="67" font-size="17" text-anchor="middle" fill="#172334">Reference feature absent</text><rect x="255" y="90" width="230" height="115" fill="#e2f1e9" stroke="#cbd5e1"/><text x="370" y="137" font-size="31" text-anchor="middle" fill="#172334">TP</text><text x="370" y="167" font-size="17" text-anchor="middle" fill="#172334">True positive</text><rect x="495" y="90" width="230" height="115" fill="#f8e5e5" stroke="#cbd5e1"/><text x="610" y="137" font-size="31" text-anchor="middle" fill="#172334">FP</text><text x="610" y="167" font-size="17" text-anchor="middle" fill="#172334">False positive</text><rect x="255" y="215" width="230" height="115" fill="#f8e5e5" stroke="#cbd5e1"/><text x="370" y="262" font-size="31" text-anchor="middle" fill="#172334">FN</text><text x="370" y="292" font-size="17" text-anchor="middle" fill="#172334">False negative</text><rect x="495" y="215" width="230" height="115" fill="#e2f1e9" stroke="#cbd5e1"/><text x="610" y="262" font-size="31" text-anchor="middle" fill="#172334">TN</text><text x="610" y="292" font-size="17" text-anchor="middle" fill="#172334">True negative</text><text x="130" y="137" font-size="17" text-anchor="middle" fill="#172334">Feature</text><text x="130" y="160" font-size="17" text-anchor="middle" fill="#172334">detected</text><text x="130" y="262" font-size="17" text-anchor="middle" fill="#172334">Feature not</text><text x="130" y="285" font-size="17" text-anchor="middle" fill="#172334">detected</text><text x="380" y="365" font-size="15" text-anchor="middle" fill="#172334">Sensitivity = TP/(TP+FN)     Specificity = TN/(TN+FP)</text><text x="380" y="391" font-size="15" text-anchor="middle" fill="#172334">False-positive rate = FP/(FP+TN)</text>
</g></svg>
