<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 505" role="img" aria-labelledby="title desc">
<title id="title">Ranked precision recall</title><desc id="desc">Exact precision and recall for five ranked detections and four reference objects.</desc>
<rect width="800" height="505" fill="white"/><g font-family="Arial, sans-serif">
<text x="400" y="28" font-size="20" text-anchor="middle" fill="#172334">Ranked detections: non-interpolated average precision</text><line x1="90" y1="65" x2="90" y2="345" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="345" x2="680" y2="345" stroke="#dbe3eb" stroke-width="1.5"/><text x="90" y="365" font-size="13" text-anchor="middle" fill="#172334">0</text><text x="81" y="349" font-size="13" text-anchor="end" fill="#172334">0</text><line x1="237.5" y1="65" x2="237.5" y2="345" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="275" x2="680" y2="275" stroke="#dbe3eb" stroke-width="1.5"/><text x="237.5" y="365" font-size="13" text-anchor="middle" fill="#172334">0.25</text><text x="81" y="279" font-size="13" text-anchor="end" fill="#172334">0.25</text><line x1="385" y1="65" x2="385" y2="345" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="205" x2="680" y2="205" stroke="#dbe3eb" stroke-width="1.5"/><text x="385" y="365" font-size="13" text-anchor="middle" fill="#172334">0.5</text><text x="81" y="209" font-size="13" text-anchor="end" fill="#172334">0.5</text><line x1="532.5" y1="65" x2="532.5" y2="345" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="135" x2="680" y2="135" stroke="#dbe3eb" stroke-width="1.5"/><text x="532.5" y="365" font-size="13" text-anchor="middle" fill="#172334">0.75</text><text x="81" y="139" font-size="13" text-anchor="end" fill="#172334">0.75</text><line x1="680" y1="65" x2="680" y2="345" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="65" x2="680" y2="65" stroke="#dbe3eb" stroke-width="1.5"/><text x="680" y="365" font-size="13" text-anchor="middle" fill="#172334">1</text><text x="81" y="69" font-size="13" text-anchor="end" fill="#172334">1</text><line x1="90" y1="65" x2="90" y2="345" stroke="#172334" stroke-width="1.5"/><line x1="90" y1="345" x2="680" y2="345" stroke="#172334" stroke-width="1.5"/><text x="385" y="390" font-size="15" text-anchor="middle" fill="#172334">Recall</text><text transform="translate(33 205) rotate(-90)" text-anchor="middle" font-size="15" fill="#172334">Precision</text><rect x="90" y="65" width="147.5" height="280" fill="#16756a" fill-opacity=".16" stroke="#16756a" stroke-width="1"/><circle cx="237.5" cy="65" r="5" fill="#16756a"/><text x="247.5" y="57" font-size="13" text-anchor="start" fill="#172334">#1</text><circle cx="237.5" cy="205" r="5" fill="#b45309"/><text x="247.5" y="197" font-size="13" text-anchor="start" fill="#172334">#2</text><rect x="237.5" y="158.33333333333334" width="147.5" height="186.66666666666666" fill="#16756a" fill-opacity=".16" stroke="#16756a" stroke-width="1"/><circle cx="385" cy="158.333" r="5" fill="#16756a"/><text x="395" y="150.333" font-size="13" text-anchor="start" fill="#172334">#3</text><rect x="385" y="135" width="147.5" height="210" fill="#16756a" fill-opacity=".16" stroke="#16756a" stroke-width="1"/><circle cx="532.5" cy="135" r="5" fill="#16756a"/><text x="542.5" y="127" font-size="13" text-anchor="start" fill="#172334">#4</text><circle cx="532.5" cy="177" r="5" fill="#b45309"/><text x="542.5" y="169" font-size="13" text-anchor="start" fill="#172334">#5</text><circle cx="115" cy="420" r="5" fill="#16756a"/><text x="130" y="425" font-size="14" text-anchor="start" fill="#172334">True positive</text><circle cx="320" cy="420" r="5" fill="#b45309"/><text x="335" y="425" font-size="14" text-anchor="start" fill="#172334">False positive</text><text x="400" y="457" font-size="17" text-anchor="middle" fill="#172334">AP = 29/48 = 0.6042; maximum recall = 0.75</text><text x="400" y="482" font-size="13" text-anchor="middle" fill="#172334">Shaded area represents the stated discrete AP convention, not COCO interpolation.</text>
</g></svg>
