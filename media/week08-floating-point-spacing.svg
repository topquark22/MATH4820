<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 355" role="img" aria-labelledby="title desc">
<title id="title">Binary64 representable values</title><desc id="desc">Exact relative spacings near 1 and ten to the sixteenth, illustrating the lost increment.</desc>
<rect width="800" height="355" fill="white"/><g font-family="Arial, sans-serif">
<text x="400" y="29" font-size="21" text-anchor="middle" fill="#172334">Binary64 spacing depends on magnitude</text><text x="50" y="67" font-size="16" text-anchor="start" fill="#172334">Near 1 (spacing changes at the power-of-two boundary)</text><line x1="125" y1="130" x2="725" y2="130" stroke="#64748b" stroke-width="1.5"/><circle cx="145" cy="130" r="5" fill="#2563eb"/><text x="145" y="155" font-size="13" text-anchor="middle" fill="#172334">1−2⁻⁵³</text><circle cx="225" cy="130" r="5" fill="#2563eb"/><text x="225" y="155" font-size="13" text-anchor="middle" fill="#172334">1</text><circle cx="385" cy="130" r="5" fill="#2563eb"/><text x="385" y="155" font-size="13" text-anchor="middle" fill="#172334">1+2⁻⁵²</text><circle cx="545" cy="130" r="5" fill="#2563eb"/><text x="545" y="155" font-size="13" text-anchor="middle" fill="#172334">1+2·2⁻⁵²</text><circle cx="705" cy="130" r="5" fill="#2563eb"/><text x="705" y="155" font-size="13" text-anchor="middle" fill="#172334">1+3·2⁻⁵²</text><text x="305" y="112" font-size="14" text-anchor="middle" fill="#16756a">2⁻⁵²</text><text x="185" y="112" font-size="14" text-anchor="middle" fill="#16756a">2⁻⁵³</text><text x="50" y="207" font-size="16" text-anchor="start" fill="#172334">Near a = 10¹⁶ (spacing = 2)</text><line x1="125" y1="265" x2="725" y2="265" stroke="#64748b" stroke-width="1.5"/><circle cx="145" cy="265" r="5" fill="#2563eb"/><text x="145" y="289" font-size="14" text-anchor="middle" fill="#172334">a−4</text><circle cx="285" cy="265" r="5" fill="#2563eb"/><text x="285" y="289" font-size="14" text-anchor="middle" fill="#172334">a−2</text><circle cx="425" cy="265" r="5" fill="#2563eb"/><text x="425" y="289" font-size="14" text-anchor="middle" fill="#172334">a</text><circle cx="565" cy="265" r="5" fill="#2563eb"/><text x="565" y="289" font-size="14" text-anchor="middle" fill="#172334">a+2</text><circle cx="705" cy="265" r="5" fill="#2563eb"/><text x="705" y="289" font-size="14" text-anchor="middle" fill="#172334">a+4</text><circle cx="495" cy="265" r="5" fill="#b45309"/><text x="495" y="242" font-size="15" text-anchor="middle" fill="#b45309">a+1</text><line x1="495" y1="260" x2="425" y2="260" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/><text x="400" y="330" font-size="14" text-anchor="middle" fill="#172334">a+1 is halfway between representable values; round-to-nearest, ties-to-even selects a.</text>
</g></svg>
