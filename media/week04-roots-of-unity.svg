<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 475" role="img" aria-labelledby="title desc">
<title id="title">Eighth roots of unity</title><desc id="desc">Eight equally spaced complex numbers on the unit circle using negative phase.</desc>
<rect width="640" height="475" fill="white"/><g font-family="Arial, sans-serif">
<text x="320" y="30" font-size="20" text-anchor="middle" fill="#172334">Eighth roots of unity: W = exp(−2πi/8)</text><circle cx="320" cy="235" r="155" fill="none" stroke="#64748b" stroke-width="1.5"/><line x1="110" y1="235" x2="530" y2="235" stroke="#64748b" stroke-width="1.5"/><line x1="320" y1="50" x2="320" y2="420" stroke="#64748b" stroke-width="1.5"/><text x="535" y="240" font-size="14" text-anchor="middle" fill="#172334">Re</text><text x="335" y="55" font-size="14" text-anchor="middle" fill="#172334">Im</text><line x1="320" y1="235" x2="475" y2="235" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="475" cy="235" r="5" fill="#2563eb"/><text x="498" y="240" font-size="15" text-anchor="middle" fill="#172334">W^0</text><line x1="320" y1="235" x2="429.602" y2="344.602" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="429.602" cy="344.602" r="5" fill="#2563eb"/><text x="445.865" y="365.865" font-size="15" text-anchor="middle" fill="#172334">W^1</text><line x1="320" y1="235" x2="320" y2="390" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="320" cy="390" r="5" fill="#2563eb"/><text x="320" y="418" font-size="15" text-anchor="middle" fill="#172334">W^2</text><line x1="320" y1="235" x2="210.398" y2="344.602" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="210.398" cy="344.602" r="5" fill="#2563eb"/><text x="194.135" y="365.865" font-size="15" text-anchor="middle" fill="#172334">W^3</text><line x1="320" y1="235" x2="165" y2="235" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="165" cy="235" r="5" fill="#2563eb"/><text x="142" y="240" font-size="15" text-anchor="middle" fill="#172334">W^4</text><line x1="320" y1="235" x2="210.398" y2="125.398" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="210.398" cy="125.398" r="5" fill="#2563eb"/><text x="194.135" y="114.135" font-size="15" text-anchor="middle" fill="#172334">W^5</text><line x1="320" y1="235" x2="320" y2="80" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="320" cy="80" r="5" fill="#2563eb"/><text x="320" y="62" font-size="15" text-anchor="middle" fill="#172334">W^6</text><line x1="320" y1="235" x2="429.602" y2="125.398" stroke="#dbe3eb" stroke-width="1.5"/><circle cx="429.602" cy="125.398" r="5" fill="#2563eb"/><text x="445.865" y="114.135" font-size="15" text-anchor="middle" fill="#172334">W^7</text><text x="320" y="450" font-size="14" text-anchor="middle" fill="#172334">Increasing k proceeds clockwise for the forward DFT convention.</text>
</g></svg>
