<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 350" role="img" aria-labelledby="title desc">
  <title id="title">Bilinear interpolation</title>
  <desc id="desc">A unit cell with the four grid samples and a weighted interpolation point.</desc>
  <rect width="740" height="350" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
<text x="360" y="30" font-size="21" text-anchor="middle" fill="#172334">Bilinear interpolation in a unit cell</text><rect x="120" y="65" width="230" height="230" fill="#eef4ff" stroke="#64748b"/><line x1="177.5" y1="65" x2="177.5" y2="295" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="120" y1="122.5" x2="350" y2="122.5" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="120" y1="295" x2="177.5" y2="122.5" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 4"/><circle cx="120" cy="295" r="6" fill="#2563eb"/><text x="120" y="317" font-size="15" text-anchor="middle" fill="#172334">I(0,0)</text><line x1="350" y1="295" x2="177.5" y2="122.5" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 4"/><circle cx="350" cy="295" r="6" fill="#2563eb"/><text x="350" y="317" font-size="15" text-anchor="middle" fill="#172334">I(1,0)</text><line x1="120" y1="65" x2="177.5" y2="122.5" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 4"/><circle cx="120" cy="65" r="6" fill="#2563eb"/><text x="120" y="52" font-size="15" text-anchor="middle" fill="#172334">I(0,1)</text><line x1="350" y1="65" x2="177.5" y2="122.5" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 4"/><circle cx="350" cy="65" r="6" fill="#2563eb"/><text x="350" y="52" font-size="15" text-anchor="middle" fill="#172334">I(1,1)</text><circle cx="177.5" cy="122.5" r="6" fill="#b45309"/><text x="187.5" y="110.5" font-size="14" text-anchor="start" fill="#b45309">(a,b) = (0.25,0.75)</text><text x="390" y="90" font-size="17" text-anchor="start" fill="#172334">Four interpolation weights</text><text x="390" y="125" font-size="15" text-anchor="start" fill="#172334">w00 = (1−a)(1−b) = 0.1875</text><text x="390" y="155" font-size="15" text-anchor="start" fill="#172334">w10 = a(1−b) = 0.0625</text><text x="390" y="185" font-size="15" text-anchor="start" fill="#172334">w01 = (1−a)b = 0.5625</text><text x="390" y="215" font-size="15" text-anchor="start" fill="#172334">w11 = ab = 0.1875</text><text x="390" y="255" font-size="17" text-anchor="start" fill="#16756a">Sum = 1</text>
  </g>
</svg>
