<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 495" role="img" aria-labelledby="title desc">
<title id="title">Pareto dominance</title><desc id="desc">Six artificial configurations, with A through D nondominated and E and F dominated.</desc>
<rect width="800" height="495" fill="white"/><g font-family="Arial, sans-serif">
<text x="400" y="30" font-size="21" text-anchor="middle" fill="#172334">Pareto dominance in a finite configuration set</text><line x1="90" y1="70" x2="90" y2="370" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="370" x2="710" y2="370" stroke="#dbe3eb" stroke-width="1.5"/><text x="90" y="390" font-size="13" text-anchor="middle" fill="#172334">0</text><text x="81" y="374" font-size="13" text-anchor="end" fill="#172334">0</text><line x1="245" y1="70" x2="245" y2="370" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="295" x2="710" y2="295" stroke="#dbe3eb" stroke-width="1.5"/><text x="245" y="390" font-size="13" text-anchor="middle" fill="#172334">0.25</text><text x="81" y="299" font-size="13" text-anchor="end" fill="#172334">0.25</text><line x1="400" y1="70" x2="400" y2="370" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="220" x2="710" y2="220" stroke="#dbe3eb" stroke-width="1.5"/><text x="400" y="390" font-size="13" text-anchor="middle" fill="#172334">0.5</text><text x="81" y="224" font-size="13" text-anchor="end" fill="#172334">0.5</text><line x1="555" y1="70" x2="555" y2="370" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="145" x2="710" y2="145" stroke="#dbe3eb" stroke-width="1.5"/><text x="555" y="390" font-size="13" text-anchor="middle" fill="#172334">0.75</text><text x="81" y="149" font-size="13" text-anchor="end" fill="#172334">0.75</text><line x1="710" y1="70" x2="710" y2="370" stroke="#dbe3eb" stroke-width="1.5"/><line x1="90" y1="70" x2="710" y2="70" stroke="#dbe3eb" stroke-width="1.5"/><text x="710" y="390" font-size="13" text-anchor="middle" fill="#172334">1</text><text x="81" y="74" font-size="13" text-anchor="end" fill="#172334">1</text><line x1="90" y1="70" x2="90" y2="370" stroke="#172334" stroke-width="1.5"/><line x1="90" y1="370" x2="710" y2="370" stroke="#172334" stroke-width="1.5"/><text x="400" y="415" font-size="15" text-anchor="middle" fill="#172334">Privacy leakage P (minimize)</text><text transform="translate(33 220) rotate(-90)" text-anchor="middle" font-size="15" fill="#172334">Utility U (maximize)</text><path d="M121 280 L214 250 L307 130 L462 100" fill="none" stroke="#16756a" stroke-width="2" stroke-dasharray="6 4"/><circle cx="121" cy="280" r="6" fill="#16756a"/><text x="131" y="271" font-size="16" text-anchor="start" fill="#16756a">A</text><circle cx="214" cy="250" r="6" fill="#16756a"/><text x="224" y="241" font-size="16" text-anchor="start" fill="#16756a">B</text><circle cx="307" cy="130" r="6" fill="#16756a"/><text x="317" y="121" font-size="16" text-anchor="start" fill="#16756a">C</text><circle cx="462" cy="100" r="6" fill="#16756a"/><text x="472" y="91" font-size="16" text-anchor="start" fill="#16756a">D</text><circle cx="338" cy="190" r="6" fill="#64748b"/><text x="348" y="181" font-size="16" text-anchor="start" fill="#64748b">E</text><circle cx="555" cy="115" r="6" fill="#64748b"/><text x="565" y="106" font-size="16" text-anchor="start" fill="#64748b">F</text><circle cx="115" cy="440" r="5" fill="#16756a"/><text x="128" y="445" font-size="14" text-anchor="start" fill="#172334">Nondominated</text><circle cx="325" cy="440" r="5" fill="#64748b"/><text x="338" y="445" font-size="14" text-anchor="start" fill="#172334">Dominated</text><text x="400" y="472" font-size="14" text-anchor="middle" fill="#172334">Dashed segments guide the eye; intermediate configurations need not exist.</text>
</g></svg>
