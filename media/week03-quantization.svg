34">-5</text><line x1="75" y1="420" x2="645" y2="420" stroke="#dbe3eb" stroke-width="1.5"/><text x="66" y="425" font-size="13" text-anchor="end" fill="#172334">0</text><line x1="75" y1="355" x2="645" y2="355" stroke="#dbe3eb" stroke-width="1.5"/><text x="66" y="360" font-size="13" text-anchor="end" fill="#172334">5</text><line x1="75" y1="355" x2="75" y2="485" stroke="#172334" stroke-width="1.5"/><line x1="75" y1="485" x2="645" y2="485" stroke="#172334" stroke-width="1.5"/><text x="360" y="531" font-size="15" text-anchor="middle" fill="#172334">Input coefficient</text><text transform="translate(23 420) rotate(-90)" text-anchor="middle" font-size="15" fill="#172334">Error</text><line x1="75" y1="420" x2="146.25" y2="485" stroke="#16756a" stroke-width="2.5"/><line x1="146.25" y1="355" x2="288.75" y2="485" stroke="#16756a" stroke-width="2.5"/><line x1="288.75" y1="355" x2="431.25" y2="485" stroke="#16756a" stroke-width="2.5"/><line x1="431.25" y1="355" x2="573.75" y2="485" stroke="#16756a" stroke-width="2.5"/><line x1="573.75" y1="355" x2="645" y2="420" stroke="#16756a" stroke-width="2.5"/><text x="360" y="555" font-size="14" text-anchor="middle" fill="#172334">Error = decoded − original; magnitude ≤ Q/2.</text>
