<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
<title id="title">Frame-wise and persistent synthesis</title><desc id="desc">Five artificial frames in each row, comparing independent colors with a persistent synthetic color.</desc>
<rect width="820" height="430" fill="white"/><g font-family="Arial, sans-serif">
<text x="410" y="28" font-size="20" text-anchor="middle" fill="#172334">Frame-wise replacement versus persistent synthetic appearance</text><text x="410" y="60" font-size="17" text-anchor="middle" fill="#172334">Independent appearances</text><rect x="40" y="72" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="82" cy="102" r="12" fill="#2563eb"/><path d="M66 121 Q82 112 98 121 L102 148 H62 Z" fill="#2563eb"/><text x="105" y="198" font-size="14" text-anchor="middle" fill="#172334">Frame 1</text><rect x="190" y="72" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="240" cy="102" r="12" fill="#b45309"/><path d="M224 121 Q240 112 256 121 L260 148 H220 Z" fill="#b45309"/><text x="255" y="198" font-size="14" text-anchor="middle" fill="#172334">Frame 2</text><rect x="340" y="72" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="398" cy="102" r="12" fill="#7c3aed"/><path d="M382 121 Q398 112 414 121 L418 148 H378 Z" fill="#7c3aed"/><text x="405" y="198" font-size="14" text-anchor="middle" fill="#172334">Frame 3</text><rect x="490" y="72" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="556" cy="102" r="12" fill="#16756a"/><path d="M540 121 Q556 112 572 121 L576 148 H536 Z" fill="#16756a"/><text x="555" y="198" font-size="14" text-anchor="middle" fill="#172334">Frame 4</text><rect x="640" y="72" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="714" cy="102" r="12" fill="#b91c1c"/><path d="M698 121 Q714 112 730 121 L734 148 H694 Z" fill="#b91c1c"/><text x="705" y="198" font-size="14" text-anchor="middle" fill="#172334">Frame 5</text><text x="410" y="225" font-size="17" text-anchor="middle" fill="#172334">Persistent appearance</text><rect x="40" y="237" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="82" cy="267" r="12" fill="#2563eb"/><path d="M66 286 Q82 277 98 286 L102 313 H62 Z" fill="#2563eb"/><text x="105" y="363" font-size="14" text-anchor="middle" fill="#172334">Frame 1</text><rect x="190" y="237" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="240" cy="267" r="12" fill="#2563eb"/><path d="M224 286 Q240 277 256 286 L260 313 H220 Z" fill="#2563eb"/><text x="255" y="363" font-size="14" text-anchor="middle" fill="#172334">Frame 2</text><rect x="340" y="237" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="398" cy="267" r="12" fill="#2563eb"/><path d="M382 286 Q398 277 414 286 L418 313 H378 Z" fill="#2563eb"/><text x="405" y="363" font-size="14" text-anchor="middle" fill="#172334">Frame 3</text><rect x="490" y="237" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="556" cy="267" r="12" fill="#2563eb"/><path d="M540 286 Q556 277 572 286 L576 313 H536 Z" fill="#2563eb"/><text x="555" y="363" font-size="14" text-anchor="middle" fill="#172334">Frame 4</text><rect x="640" y="237" width="130" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="714" cy="267" r="12" fill="#2563eb"/><path d="M698 286 Q714 277 730 286 L734 313 H694 Z" fill="#2563eb"/><text x="705" y="363" font-size="14" text-anchor="middle" fill="#172334">Frame 5</text><text x="410" y="407" font-size="14" text-anchor="middle" fill="#172334">Motion is retained in both rows; only the schematic replacement appearance changes.</text>
</g></svg>
