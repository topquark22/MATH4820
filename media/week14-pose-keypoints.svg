<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
<title id="title">Pose keypoint tolerance</title><desc id="desc">Four artificial reference keypoints, two correct predictions, one outside tolerance and one missing.</desc>
<rect width="800" height="430" fill="white"/><g font-family="Arial, sans-serif">
<text x="400" y="30" font-size="20" text-anchor="middle" fill="#172334">Pose-keypoint accuracy under a fixed tolerance</text><line x1="180" y1="130" x2="340" y2="130" stroke="#64748b" stroke-width="3"/><line x1="180" y1="130" x2="180" y2="290" stroke="#64748b" stroke-width="3"/><line x1="340" y1="130" x2="340" y2="290" stroke="#64748b" stroke-width="3"/><line x1="180" y1="290" x2="340" y2="290" stroke="#64748b" stroke-width="3"/><circle cx="180" cy="130" r="20" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-dasharray="4 3"/><circle cx="180" cy="130" r="4" fill="#2563eb"/><text x="152" y="134" font-size="14" text-anchor="end" fill="#172334">K1</text><line x1="180" y1="130" x2="186" y2="133" stroke="#16756a" stroke-width="2"/><circle cx="186" cy="133" r="5" fill="#16756a"/><circle cx="340" cy="130" r="20" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-dasharray="4 3"/><circle cx="340" cy="130" r="4" fill="#2563eb"/><text x="312" y="134" font-size="14" text-anchor="end" fill="#172334">K2</text><line x1="340" y1="130" x2="354" y2="130" stroke="#16756a" stroke-width="2"/><circle cx="354" cy="130" r="5" fill="#16756a"/><circle cx="180" cy="290" r="20" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-dasharray="4 3"/><circle cx="180" cy="290" r="4" fill="#2563eb"/><text x="152" y="294" font-size="14" text-anchor="end" fill="#172334">K3</text><line x1="180" y1="290" x2="210" y2="290" stroke="#b45309" stroke-width="2"/><circle cx="210" cy="290" r="5" fill="#b45309"/><circle cx="340" cy="290" r="20" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-dasharray="4 3"/><circle cx="340" cy="290" r="4" fill="#2563eb"/><text x="312" y="294" font-size="14" text-anchor="end" fill="#172334">K4</text><text x="368" y="294" font-size="14" text-anchor="start" fill="#b45309">missing</text><text x="590" y="120" font-size="17" text-anchor="middle" fill="#172334">Reference scale = 200</text><text x="590" y="155" font-size="17" text-anchor="middle" fill="#172334">Threshold = 0.10</text><text x="590" y="190" font-size="17" text-anchor="middle" fill="#172334">Tolerance = 20</text><text x="590" y="248" font-size="22" text-anchor="middle" fill="#16756a">PCK = 2/4 = 0.50</text><circle cx="140" cy="365" r="5" fill="#2563eb"/><text x="153" y="370" font-size="14" text-anchor="start" fill="#172334">Reference</text><circle cx="325" cy="365" r="5" fill="#16756a"/><text x="338" y="370" font-size="14" text-anchor="start" fill="#172334">Correct prediction</text><circle cx="560" cy="365" r="5" fill="#b45309"/><text x="573" y="370" font-size="14" text-anchor="start" fill="#172334">Incorrect prediction</text><text x="400" y="405" font-size="14" text-anchor="middle" fill="#172334">Missing eligible predictions remain in the denominator.</text>
</g></svg>
