<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Double quantization histograms</title>
  <desc id="desc">Counts computed by applying the specified ideal scalar quantizers to a uniform finite integer range.</desc>
  <rect width="800" height="400" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
<text x="400" y="28" font-size="20" text-anchor="middle" fill="#172334">Idealized double quantization of uniform integer inputs</text><text x="400" y="50" font-size="15" text-anchor="middle" fill="#172334">Q₁ = 7, Q₂ = 5; original coefficients −35 through 35</text><line x1="60" y1="305" x2="750" y2="305" stroke="#dbe3eb" stroke-width="1.5"/><text x="52" y="310" font-size="13" text-anchor="end" fill="#172334">0</text><line x1="60" y1="265" x2="750" y2="265" stroke="#dbe3eb" stroke-width="1.5"/><text x="52" y="270" font-size="13" text-anchor="end" fill="#172334">2</text><line x1="60" y1="225" x2="750" y2="225" stroke="#dbe3eb" stroke-width="1.5"/><text x="52" y="230" font-size="13" text-anchor="end" fill="#172334">4</text><line x1="60" y1="185" x2="750" y2="185" stroke="#dbe3eb" stroke-width="1.5"/><text x="52" y="190" font-size="13" text-anchor="end" fill="#172334">6</text><line x1="60" y1="145" x2="750" y2="145" stroke="#dbe3eb" stroke-width="1.5"/><text x="52" y="150" font-size="13" text-anchor="end" fill="#172334">8</text><line x1="60" y1="105" x2="750" y2="105" stroke="#dbe3eb" stroke-width="1.5"/><text x="52" y="110" font-size="13" text-anchor="end" fill="#172334">10</text><rect x="65" y="245" width="16.56" height="60" fill="#2563eb" stroke="none"/><rect x="83.4" y="225" width="16.56" height="80" fill="#b45309" stroke="none"/><text x="82.48" y="326" font-size="12" text-anchor="middle" fill="#172334">-35</text><rect x="111" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="129.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="128.48" y="326" font-size="12" text-anchor="middle" fill="#172334">-30</text><rect x="157" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="175.4" y="305" width="16.56" height="0" fill="#b45309" stroke="none"/><text x="174.48" y="326" font-size="12" text-anchor="middle" fill="#172334">-25</text><rect x="203" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="221.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="220.48" y="326" font-size="12" text-anchor="middle" fill="#172334">-20</text><rect x="249" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="267.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="266.48" y="326" font-size="12" text-anchor="middle" fill="#172334">-15</text><rect x="295" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="313.4" y="305" width="16.56" height="0" fill="#b45309" stroke="none"/><text x="312.48" y="326" font-size="12" text-anchor="middle" fill="#172334">-10</text><rect x="341" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="359.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="358.48" y="326" font-size="12" text-anchor="middle" fill="#172334">-5</text><rect x="387" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="405.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="404.48" y="326" font-size="12" text-anchor="middle" fill="#172334">0</text><rect x="433" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="451.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="450.48" y="326" font-size="12" text-anchor="middle" fill="#172334">5</text><rect x="479" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="497.4" y="305" width="16.56" height="0" fill="#b45309" stroke="none"/><text x="496.48" y="326" font-size="12" text-anchor="middle" fill="#172334">10</text><rect x="525" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="543.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="542.48" y="326" font-size="12" text-anchor="middle" fill="#172334">15</text><rect x="571" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="589.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="588.48" y="326" font-size="12" text-anchor="middle" fill="#172334">20</text><rect x="617" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="635.4" y="305" width="16.56" height="0" fill="#b45309" stroke="none"/><text x="634.48" y="326" font-size="12" text-anchor="middle" fill="#172334">25</text><rect x="663" y="205" width="16.56" height="100" fill="#2563eb" stroke="none"/><rect x="681.4" y="165" width="16.56" height="140" fill="#b45309" stroke="none"/><text x="680.48" y="326" font-size="12" text-anchor="middle" fill="#172334">30</text><rect x="709" y="245" width="16.56" height="60" fill="#2563eb" stroke="none"/><rect x="727.4" y="225" width="16.56" height="80" fill="#b45309" stroke="none"/><text x="726.48" y="326" font-size="12" text-anchor="middle" fill="#172334">35</text><line x1="60" y1="305" x2="750" y2="305" stroke="#172334" stroke-width="1.5"/><line x1="105" y1="350" x2="132" y2="350" stroke="#2563eb" stroke-width="3"/><text x="139" y="355" font-size="14" text-anchor="start" fill="#172334">Direct Q₂</text><line x1="390" y1="350" x2="417" y2="350" stroke="#b45309" stroke-width="3"/><text x="424" y="355" font-size="14" text-anchor="start" fill="#172334">Q₁ then Q₂</text><text x="400" y="380" font-size="14" text-anchor="middle" fill="#172334">Scalar model only: no IDCT, rounding of pixels, or grid misalignment.</text>
  </g>
</svg>
