<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 355" role="img" aria-labelledby="title desc">
<title id="title">Box overlap and reference coverage</title><desc id="desc">Two synthetic rectangle examples illustrating different IoU and coverage scores.</desc>
<rect width="820" height="355" fill="white"/><g font-family="Arial, sans-serif">
<text x="410" y="30" font-size="21" text-anchor="middle" fill="#172334">Geometric overlap versus reference coverage</text><rect x="85" y="90" width="160" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="125" y="110" width="160" height="100" fill="#fbbf24" fill-opacity=".30" stroke="#b45309" stroke-width="2"/><text x="165" y="260" font-size="17" text-anchor="middle" fill="#172334">Partial prediction</text><text x="165" y="287" font-size="15" text-anchor="middle" fill="#172334">IoU = 0.429; coverage = 0.60</text><rect x="485" y="90" width="160" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="460" y="70" width="210" height="140" fill="#fbbf24" fill-opacity=".30" stroke="#b45309" stroke-width="2"/><text x="565" y="260" font-size="17" text-anchor="middle" fill="#172334">Oversized prediction</text><text x="565" y="287" font-size="15" text-anchor="middle" fill="#172334">IoU = 0.544; coverage = 1.00</text><line x1="150" y1="325" x2="174" y2="325" stroke="#2563eb" stroke-width="3"/><text x="181" y="330" font-size="14" text-anchor="start" fill="#172334">Reference region</text><line x1="450" y1="325" x2="474" y2="325" stroke="#b45309" stroke-width="3"/><text x="481" y="330" font-size="14" text-anchor="start" fill="#172334">Predicted region</text>
</g></svg>
