<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Linear and circular convolution</title><desc id="desc">Calculated outputs of the lecture example, showing the tail wrapping to the first index.</desc>
<rect width="760" height="360" fill="white"/><g font-family="Arial, sans-serif">
<text x="380" y="29" font-size="21" text-anchor="middle" fill="#172334">Linear convolution versus circular wrap-around</text><text x="380" y="55" font-size="16" text-anchor="middle" fill="#172334">f = (1, 2, 3, 4), h = (1, 1)</text><text x="195" y="86" font-size="17" text-anchor="middle" fill="#172334">Full linear output</text><rect x="60" y="240" width="36" height="20" fill="#2563eb" stroke="none"/><text x="78" y="230" font-size="15" text-anchor="middle" fill="#172334">1</text><text x="78" y="281" font-size="13" text-anchor="middle" fill="#172334">0</text><rect x="118" y="200" width="36" height="60" fill="#2563eb" stroke="none"/><text x="136" y="190" font-size="15" text-anchor="middle" fill="#172334">3</text><text x="136" y="281" font-size="13" text-anchor="middle" fill="#172334">1</text><rect x="176" y="160" width="36" height="100" fill="#2563eb" stroke="none"/><text x="194" y="150" font-size="15" text-anchor="middle" fill="#172334">5</text><text x="194" y="281" font-size="13" text-anchor="middle" fill="#172334">2</text><rect x="234" y="120" width="36" height="140" fill="#2563eb" stroke="none"/><text x="252" y="110" font-size="15" text-anchor="middle" fill="#172334">7</text><text x="252" y="281" font-size="13" text-anchor="middle" fill="#172334">3</text><rect x="292" y="180" width="36" height="80" fill="#b45309" stroke="none"/><text x="310" y="170" font-size="15" text-anchor="middle" fill="#172334">4</text><text x="310" y="281" font-size="13" text-anchor="middle" fill="#172334">4</text><line x1="45" y1="260" x2="345" y2="260" stroke="#64748b" stroke-width="1.5"/><text x="570" y="86" font-size="17" text-anchor="middle" fill="#172334">Length-4 circular output</text><rect x="435" y="160" width="36" height="100" fill="#2563eb" stroke="none"/><text x="453" y="150" font-size="15" text-anchor="middle" fill="#172334">5</text><text x="453" y="281" font-size="13" text-anchor="middle" fill="#172334">0</text><rect x="493" y="200" width="36" height="60" fill="#2563eb" stroke="none"/><text x="511" y="190" font-size="15" text-anchor="middle" fill="#172334">3</text><text x="511" y="281" font-size="13" text-anchor="middle" fill="#172334">1</text><rect x="551" y="160" width="36" height="100" fill="#2563eb" stroke="none"/><text x="569" y="150" font-size="15" text-anchor="middle" fill="#172334">5</text><text x="569" y="281" font-size="13" text-anchor="middle" fill="#172334">2</text><rect x="609" y="120" width="36" height="140" fill="#2563eb" stroke="none"/><text x="627" y="110" font-size="15" text-anchor="middle" fill="#172334">7</text><text x="627" y="281" font-size="13" text-anchor="middle" fill="#172334">3</text><line x1="420" y1="260" x2="720" y2="260" stroke="#64748b" stroke-width="1.5"/><path d="M310 195 L365 195 L365 145 L435 145" fill="none" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/><text x="380" y="312" font-size="16" text-anchor="middle" fill="#172334">The last value 4 wraps into index 0: 1 + 4 = 5.</text><text x="380" y="338" font-size="15" text-anchor="middle" fill="#172334">Padding to length 5 avoids this aliasing.</text>
</g></svg>
