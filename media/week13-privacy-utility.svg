<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
<title id="title">Toy privacy and utility trade-off</title><desc id="desc">Exact diagonal relation for an erasure mechanism preserving a fair bit with probability r.</desc>
<rect width="780" height="420" fill="white"/><g font-family="Arial, sans-serif">
<text x="390" y="29" font-size="21" text-anchor="middle" fill="#172334">Exact toy privacy–utility conflict</text><line x1="95" y1="65" x2="95" y2="315" stroke="#dbe3eb" stroke-width="1.5"/><line x1="95" y1="315" x2="695" y2="315" stroke="#dbe3eb" stroke-width="1.5"/><text x="95" y="337" font-size="13" text-anchor="middle" fill="#172334">0</text><text x="85" y="320" font-size="13" text-anchor="end" fill="#172334">0</text><line x1="245" y1="65" x2="245" y2="315" stroke="#dbe3eb" stroke-width="1.5"/><line x1="95" y1="252.5" x2="695" y2="252.5" stroke="#dbe3eb" stroke-width="1.5"/><text x="245" y="337" font-size="13" text-anchor="middle" fill="#172334">0.25</text><text x="85" y="257.5" font-size="13" text-anchor="end" fill="#172334">0.25</text><line x1="395" y1="65" x2="395" y2="315" stroke="#dbe3eb" stroke-width="1.5"/><line x1="95" y1="190" x2="695" y2="190" stroke="#dbe3eb" stroke-width="1.5"/><text x="395" y="337" font-size="13" text-anchor="middle" fill="#172334">0.5</text><text x="85" y="195" font-size="13" text-anchor="end" fill="#172334">0.5</text><line x1="545" y1="65" x2="545" y2="315" stroke="#dbe3eb" stroke-width="1.5"/><line x1="95" y1="127.5" x2="695" y2="127.5" stroke="#dbe3eb" stroke-width="1.5"/><text x="545" y="337" font-size="13" text-anchor="middle" fill="#172334">0.75</text><text x="85" y="132.5" font-size="13" text-anchor="end" fill="#172334">0.75</text><line x1="695" y1="65" x2="695" y2="315" stroke="#dbe3eb" stroke-width="1.5"/><line x1="95" y1="65" x2="695" y2="65" stroke="#dbe3eb" stroke-width="1.5"/><text x="695" y="337" font-size="13" text-anchor="middle" fill="#172334">1</text><text x="85" y="70" font-size="13" text-anchor="end" fill="#172334">1</text><line x1="95" y1="65" x2="95" y2="315" stroke="#172334" stroke-width="1.5"/><line x1="95" y1="315" x2="695" y2="315" stroke="#172334" stroke-width="1.5"/><line x1="95" y1="315" x2="695" y2="65" stroke="#16756a" stroke-width="3"/><circle cx="95" cy="315" r="5" fill="#16756a"/><circle cx="245" cy="252.5" r="5" fill="#16756a"/><circle cx="395" cy="190" r="5" fill="#16756a"/><circle cx="545" cy="127.5" r="5" fill="#16756a"/><circle cx="695" cy="65" r="5" fill="#16756a"/><text x="395" y="366" font-size="15" text-anchor="middle" fill="#172334">Utility: probability of retaining the protected bit</text><text transform="translate(27 190) rotate(-90)" text-anchor="middle" font-size="15" fill="#172334">Mutual information (bits)</text><text x="390" y="397" font-size="14" text-anchor="middle" fill="#172334">Fair binary attribute, independently erased with probability 1 − r; leakage = r bits.</text>
</g></svg>
