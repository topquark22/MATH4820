<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 350" role="img" aria-labelledby="title desc">
<title id="title">Radix-2 FFT butterfly</title><desc id="desc">Two half-size DFT outputs combine through a twiddle factor, sum and difference.</desc>
<rect width="740" height="350" fill="white"/><g font-family="Arial, sans-serif">
<text x="360" y="30" font-size="22" text-anchor="middle" fill="#172334">Radix-2 FFT butterfly</text><text x="85" y="105" font-size="21" text-anchor="middle" fill="#172334">E[k]</text><text x="85" y="255" font-size="21" text-anchor="middle" fill="#172334">O[k]</text><circle cx="135" cy="100" r="5" fill="#2563eb"/><circle cx="135" cy="250" r="5" fill="#16756a"/><line x1="140" y1="100" x2="475" y2="100" stroke="#2563eb" stroke-width="2"/><path d="M465.996 104.35 L475 100 L465.996 95.65" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/><line x1="140" y1="100" x2="475" y2="250" stroke="#2563eb" stroke-width="2"/><path d="M465.004 250.29 L475 250 L468.559 242.35" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/><line x1="140" y1="250" x2="270" y2="250" stroke="#16756a" stroke-width="2"/><path d="M260.996 254.35 L270 250 L260.996 245.65" fill="none" stroke="#16756a" stroke-width="2" stroke-linejoin="round"/><rect x="270" y="225" width="108" height="50" fill="#e5f1eb" stroke="#16756a"/><text x="324" y="256" font-size="19" text-anchor="middle" fill="#172334">× W^k</text><line x1="378" y1="250" x2="475" y2="100" stroke="#16756a" stroke-width="2"/><path d="M473.763 109.923 L475 100 L466.458 105.199" fill="none" stroke="#16756a" stroke-width="2" stroke-linejoin="round"/><line x1="378" y1="250" x2="475" y2="250" stroke="#16756a" stroke-width="2"/><path d="M465.996 254.35 L475 250 L465.996 245.65" fill="none" stroke="#16756a" stroke-width="2" stroke-linejoin="round"/><circle cx="495" cy="100" r="19" fill="white" stroke="#172334"/><circle cx="495" cy="250" r="19" fill="white" stroke="#172334"/><text x="495" y="107" font-size="23" text-anchor="middle" fill="#172334">+</text><text x="495" y="257" font-size="23" text-anchor="middle" fill="#172334">−</text><line x1="514" y1="100" x2="570" y2="100" stroke="#172334" stroke-width="2"/><path d="M560.996 104.35 L570 100 L560.996 95.65" fill="none" stroke="#172334" stroke-width="2" stroke-linejoin="round"/><line x1="514" y1="250" x2="570" y2="250" stroke="#172334" stroke-width="2"/><path d="M560.996 254.35 L570 250 L560.996 245.65" fill="none" stroke="#172334" stroke-width="2" stroke-linejoin="round"/><text x="580" y="105" font-size="19" text-anchor="start" fill="#172334">X[k]</text><text x="580" y="255" font-size="19" text-anchor="start" fill="#172334">X[k+N/2]</text><text x="360" y="323" font-size="16" text-anchor="middle" fill="#172334">Top: E[k] + W^k O[k]     Bottom: E[k] − W^k O[k]</text>
</g></svg>
