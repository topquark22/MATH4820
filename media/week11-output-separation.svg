<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Output separation and uncertainty</title>
  <desc id="desc">Two rows show intervals around outputs zero, one and two. Radius 0.4 yields disjoint intervals; radius 0.6 yields overlap.</desc>
  <rect width="680" height="300" fill="white"/>
  <g font-family="Arial,sans-serif" fill="#172334">
    <text x="340" y="30" text-anchor="middle" font-size="20">Artificial scalar outputs: 0, 1, 2</text>
    <text x="36" y="65" font-size="16">Radius 0.4 — disjoint</text>
    <text x="36" y="176" font-size="16">Radius 0.6 — overlapping</text>
    <g stroke="#64748b" stroke-width="1.5"><path d="M40 105 H640"/><path d="M40 216 H640"/></g>
    <g fill="#2563eb" fill-opacity=".22" stroke="#2563eb">
      <rect x="88" y="87" width="144" height="36" rx="8"/><rect x="268" y="87" width="144" height="36" rx="8"/><rect x="448" y="87" width="144" height="36" rx="8"/>
    </g>
    <g fill="#d97706" fill-opacity=".24" stroke="#b45309">
      <rect x="52" y="198" width="216" height="36" rx="8"/><rect x="232" y="198" width="216" height="36" rx="8"/><rect x="412" y="198" width="216" height="36" rx="8"/>
    </g>
    <g fill="#172334"><circle cx="160" cy="105" r="5"/><circle cx="340" cy="105" r="5"/><circle cx="520" cy="105" r="5"/><circle cx="160" cy="216" r="5"/><circle cx="340" cy="216" r="5"/><circle cx="520" cy="216" r="5"/></g>
    <g font-size="16" text-anchor="middle"><text x="160" y="145">0</text><text x="340" y="145">1</text><text x="520" y="145">2</text><text x="160" y="260">0</text><text x="340" y="260">1</text><text x="520" y="260">2</text></g>
    <text x="340" y="287" text-anchor="middle" font-size="13">The center separation is one in both rows.</text>
  </g>
</svg>
